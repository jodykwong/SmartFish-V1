# 特殊指令 - 注入到 Agent prompt
special_instructions: |
  ## 窄门战略分析框架
  
  ### 核心原则
  1. **Audience First (受众优先)**: 先找到被忽视的垂直群体，再设计产品
  2. **金发姑娘区**: 市场规模 MRR 5k-30k，足以养活微型团队但不吸引大厂
  3. **自建系统信号**: 用户被迫用 Excel/手动记录/原始SOP = 高支付意愿
  4. **窄门护城河**: 行业暗知识 + 私有数据整合，而非 API 套壳
  
  ### 搜索指令
  - Query Agent: 扫描小红书、抖音、Reddit、V2EX、L站，寻找对通用AI工具不满的垂直行业
  - Media Agent: 提取视频评论中的真实抱怨和期待
  - Insight Agent: 下钻数百万条评论，识别"混乱Excel"、"手动记录"等支付意愿信号
  
  ### 输出要求
  - 必须输出 5 个明确的创业方向
  - 每个方向必须包含：受众定义、核心痛点、现有低效系统、窄门理由
  - 必须有 Zero to Sold 框架验证
  - 必须有风险评估和下一步行动
