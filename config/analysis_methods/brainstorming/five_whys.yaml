id: five_whys
name: 五个为什么
category: brainstorming
icon: ❓
short_description: 连续追问"为什么"找到问题根本原因
full_description: |
  丰田生产系统中的根因分析方法，通过连续问"为什么"来深入挖掘问题的根本原因。
  通常需要问5次"为什么"才能找到真正的根因，但实际次数可能更多或更少。
  关键是要基于事实而非假设来回答每个"为什么"。
suitable_for: [问题诊断, 根因分析, 质量改进, 故障排查]
prompt_template: |
  请使用五个为什么方法分析问题："{topic}"

  🎯 问题陈述：
  [清晰描述要分析的问题]

  🔍 五个为什么分析：

  问题：{topic}
  为什么1：[基于事实回答为什么会发生这个问题]
  
  为什么2：[针对上一个答案继续问为什么]
  
  为什么3：[继续深入追问]
  
  为什么4：[进一步挖掘根因]
  
  为什么5：[找到最终根本原因]

  💡 根本原因：
  [总结找到的根本原因]

  🎯 改进措施：
  [针对根本原因提出具体的改进建议]