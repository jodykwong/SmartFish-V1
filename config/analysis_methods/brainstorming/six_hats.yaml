id: six_hats
name: 六顶思考帽
category: brainstorming
icon: 🎩
short_description: 从白/红/黑/黄/绿/蓝六种视角全面分析问题
full_description: |
  德·博诺的六顶思考帽方法，通过六种不同颜色的帽子代表不同思维模式：
  白帽：客观事实和数据
  红帽：情感和直觉
  黑帽：谨慎和风险
  黄帽：积极和机会
  绿帽：创意和可能性
  蓝帽：控制和组织思维过程
suitable_for: [决策分析, 团队讨论, 全面评估, 创新思考]
prompt_template: |
  请使用六顶思考帽方法分析"{topic}"：

  🤍 白帽思维（事实数据）：
  - 收集相关的客观事实和数据
  - 分析现状和已知信息

  ❤️ 红帽思维（情感直觉）：
  - 表达直觉感受和情绪反应
  - 考虑利益相关者的情感因素

  🖤 黑帽思维（谨慎风险）：
  - 识别潜在风险和问题
  - 分析可能的负面后果

  💛 黄帽思维（积极机会）：
  - 寻找积极因素和机会
  - 分析潜在收益和价值

  💚 绿帽思维（创意可能）：
  - 提出创新想法和替代方案
  - 探索新的可能性

  💙 蓝帽思维（控制组织）：
  - 总结各帽子的观点
  - 制定下一步行动计划