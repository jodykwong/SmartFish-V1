id: first_principles
name: 第一性原理
category: brainstorming
icon: 🧠
short_description: 回归基本原理，从根本假设重新构建解决方案
full_description: |
  第一性原理是一种思维方法，通过回归事物最基本的条件和假设来思考问题。
  不依赖于经验和类比，而是从最基础的真理出发，逐步推导出结论。
  这种方法能够突破传统思维限制，找到创新的解决方案。
suitable_for: [创新突破, 复杂问题分析, 战略规划, 技术创新]
prompt_template: |
  请使用第一性原理方法分析"{topic}"：

  🎯 问题定义：
  [清晰定义要分析的问题或挑战]

  🔍 拆解基本要素：
  - 这个问题涉及哪些基本要素？
  - 每个要素的本质是什么？
  - 哪些是必需的，哪些是可选的？

  ✅ 验证基本假设：
  - 我们对这个问题有哪些假设？
  - 这些假设是否成立？
  - 哪些是事实，哪些是观点？

  🧱 基础真理识别：
  - 什么是不可争议的基本事实？
  - 最底层的物理、经济、心理规律是什么？
  - 去掉所有假设后，剩下什么？

  🏗️ 重新构建：
  - 基于基础真理，如何重新构建解决方案？
  - 有哪些全新的可能性？
  - 传统方法忽略了什么？

  💡 创新洞察：
  - 第一性原理分析揭示了什么新观点？
  - 有哪些突破性的解决方案？
  - 如何验证这些新想法？

  🎯 行动建议：
  [基于第一性原理分析提出具体的行动方案]