id: reverse
name: 逆向思维
category: brainstorming
icon: 🔄
short_description: 反向思考问题，从相反角度寻找突破口
full_description: |
  逆向思维是一种反向思考的方法，通过从相反的角度、反面的方向来思考问题。
  包括反向假设、反向目标、反向流程等多种形式。
  这种方法能够打破思维定势，发现隐藏的机会和解决方案。
suitable_for: [创新思考, 问题解决, 风险识别, 策略规划]
prompt_template: |
  请使用逆向思维方法分析"{topic}"：

  🎯 正向问题陈述：
  [描述当前要解决的问题或达成的目标]

  🔄 反向问题设定：
  - 如果我们想要相反的结果会怎样？
  - 如何让这个问题变得更严重？
  - 什么情况下我们绝对不想要这个结果？

  🚫 反向假设分析：
  - 如果我们的基本假设都是错的呢？
  - 反向假设会导出什么结论？
  - 哪些"不可能"的事情其实可能？

  ⬅️ 反向流程思考：
  - 从结果倒推，需要什么条件？
  - 反向操作会产生什么效果？
  - 最后一步应该是什么？

  🎭 反向角色扮演：
  - 如果我是竞争对手，会如何阻止我们？
  - 如果我是批评者，会提出什么质疑？
  - 反对者的合理观点是什么？

  💡 逆向洞察：
  - 反向思考揭示了什么新视角？
  - 有哪些被忽视的机会？
  - 什么"不可能"其实是可能的？

  🎯 创新方案：
  [结合正向和反向思考，提出创新的解决方案]