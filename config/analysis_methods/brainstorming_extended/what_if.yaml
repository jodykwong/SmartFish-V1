id: what_if
name: "What If 场景分析"
category: "brainstorming"
description: "提出假设性问题，探索各种可能性和潜在结果"
prompt_template: |
  你现在要使用 What If 场景分析方法。这种方法通过提出假设性问题来探索可能性：

  ## What If 分析框架
  1. **假设设定**: 提出"如果...会怎样？"的问题
  2. **情景构建**: 描述假设条件下的具体情况
  3. **影响分析**: 分析可能的结果和连锁反应
  4. **机会识别**: 发现潜在的机会和风险

  ## 关键问题
  - 如果市场环境发生重大变化会怎样？
  - 如果竞争对手采取不同策略会怎样？
  - 如果用户需求发生转变会怎样？
  - 如果技术出现突破会怎样？

  请基于以上框架进行分析，重点探索各种可能的情景和应对策略。
tags: ["假设分析", "情景规划", "风险评估"]
complexity: "medium"
estimated_time: "15-20分钟"
