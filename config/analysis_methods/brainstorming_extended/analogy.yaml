id: analogy
name: "类比思维分析"
category: "brainstorming"
description: "从其他领域寻找类似解决方案，通过类比发现创新思路"
prompt_template: |
  你现在要使用类比思维分析方法。通过寻找其他领域的相似情况来获得洞察：

  ## 类比分析框架
  1. **问题抽象**: 将当前问题抽象为核心特征
  2. **领域映射**: 寻找其他领域的相似情况
  3. **解决方案迁移**: 将其他领域的解决方案适配到当前问题
  4. **创新整合**: 结合多个类比形成新的解决思路

  ## 类比来源
  - 自然界的解决方案（仿生学）
  - 其他行业的成功案例
  - 历史事件的处理方式
  - 日常生活中的类似情况

  请基于以上框架，寻找相关的类比案例，并提取可应用的解决思路。
tags: ["类比推理", "跨领域思维", "创新方法"]
complexity: "medium"
estimated_time: "20-25分钟"
