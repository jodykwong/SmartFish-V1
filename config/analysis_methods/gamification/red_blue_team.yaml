id: red_blue_team
name: 红队蓝队
category: gamification
icon: ⚔️
short_description: 攻防对抗模式，通过对抗发现漏洞和改进机会
full_description: |
  红队蓝队是一种对抗性分析方法，源于军事和网络安全领域。
  红队扮演攻击者角色，寻找弱点和漏洞；蓝队扮演防守者角色，构建防护和应对措施。
  通过这种对抗性思维，能够全面识别风险，提高系统的健壮性。
suitable_for: [风险评估, 安全分析, 竞争策略, 压力测试]
prompt_template: |
  请使用红队蓝队方法分析"{topic}"：

  🎯 对抗目标设定：
  [明确红蓝双方的对抗目标和规则]

  🔴 红队攻击分析：

  🎯 攻击目标识别：
  - 核心资产：[最有价值的攻击目标]
  - 薄弱环节：[最容易突破的地方]
  - 关键节点：[影响最大的攻击点]

  ⚡ 攻击路径规划：
  - 路径1：[第一种攻击方式和步骤]
  - 路径2：[第二种攻击方式和步骤]
  - 路径3：[第三种攻击方式和步骤]

  🛠️ 攻击工具和方法：
  - 技术手段：[可能使用的技术方法]
  - 社会工程：[心理和社交层面的攻击]
  - 内部威胁：[内部人员可能的威胁]

  🔵 蓝队防御分析：

  🛡️ 防御体系构建：
  - 预防措施：[事前防护机制]
  - 检测能力：[及时发现威胁的能力]
  - 响应机制：[事件发生后的应对措施]
  - 恢复能力：[灾后恢复和业务连续性]

  🔍 威胁监控：
  - 监控指标：[需要监控的关键指标]
  - 预警机制：[早期预警系统]
  - 情报收集：[威胁情报来源和分析]

  🚨 应急响应：
  - 响应流程：[标准应急响应流程]
  - 角色分工：[应急响应团队分工]
  - 沟通机制：[内外部沟通协调]

  ⚔️ 对抗演练结果：

  🎯 红队成功场景：
  - 成功突破的路径：[红队成功的攻击路径]
  - 利用的漏洞：[被成功利用的弱点]
  - 造成的影响：[攻击成功的潜在后果]

  🛡️ 蓝队防御效果：
  - 成功防御的攻击：[有效阻止的攻击]
  - 检测到的威胁：[及时发现的威胁]
  - 响应效率：[应急响应的效果评估]

  📊 改进建议：
  - 防御加强：[需要加强的防御措施]
  - 流程优化：[需要改进的流程]
  - 能力提升：[需要提升的能力]
  - 资源配置：[资源配置优化建议]