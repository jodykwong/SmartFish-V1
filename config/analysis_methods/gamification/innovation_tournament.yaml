id: innovation_tournament
name: 创新锦标赛
category: gamification
icon: 🏆
short_description: 多方案竞争评分，通过锦标赛机制选出最佳方案
full_description: |
  创新锦标赛是一种竞争性的方案评估方法，通过设计锦标赛机制让多个方案进行竞争。
  每个方案都有自己的"选手档案"，通过多轮比较和评分，最终选出最优方案。
  这种方法增加了分析的趣味性，同时确保了评估的全面性和公正性。
suitable_for: [方案选择, 创新评估, 产品设计, 策略制定]
prompt_template: |
  请使用创新锦标赛方法分析"{topic}"：

  🏆 锦标赛设置：
  - 比赛目标：[锦标赛要解决的核心问题]
  - 评判标准：[评分的维度和权重]
  - 比赛规则：[比较和评分的规则]

  🥊 参赛方案（选手）：

  🏃‍♂️ 方案A - [方案名称]：
  - 核心理念：[方案的核心思想]
  - 主要特点：[方案的独特优势]
  - 实施难度：[执行的复杂程度]
  - 预期效果：[预期达成的效果]
  - 选手档案：[方案的"个性"特征]

  🏃‍♀️ 方案B - [方案名称]：
  - 核心理念：[方案的核心思想]
  - 主要特点：[方案的独特优势]
  - 实施难度：[执行的复杂程度]
  - 预期效果：[预期达成的效果]
  - 选手档案：[方案的"个性"特征]

  🏃‍♂️ 方案C - [方案名称]：
  - 核心理念：[方案的核心思想]
  - 主要特点：[方案的独特优势]
  - 实施难度：[执行的复杂程度]
  - 预期效果：[预期达成的效果]
  - 选手档案：[方案的"个性"特征]

  🥊 锦标赛对战：

  第一轮 - 创新性对决：
  - 方案A vs 方案B：[创新性比较和评分]
  - 方案B vs 方案C：[创新性比较和评分]
  - 方案A vs 方案C：[创新性比较和评分]

  第二轮 - 可行性对决：
  - 方案A vs 方案B：[可行性比较和评分]
  - 方案B vs 方案C：[可行性比较和评分]
  - 方案A vs 方案C：[可行性比较和评分]

  第三轮 - 效益性对决：
  - 方案A vs 方案B：[效益性比较和评分]
  - 方案B vs 方案C：[效益性比较和评分]
  - 方案A vs 方案C：[效益性比较和评分]

  📊 积分统计：
  - 方案A总分：[各轮得分汇总]
  - 方案B总分：[各轮得分汇总]
  - 方案C总分：[各轮得分汇总]

  🏆 锦标赛结果：
  - 🥇 冠军方案：[得分最高的方案]
  - 🥈 亚军方案：[得分第二的方案]
  - 🥉 季军方案：[得分第三的方案]

  🎖️ 特殊奖项：
  - 最佳创新奖：[最具创新性的方案]
  - 最佳实用奖：[最具可行性的方案]
  - 最具潜力奖：[未来发展潜力最大的方案]

  🎯 冠军方案实施计划：
  [基于获胜方案制定的详细实施计划]

  💡 其他方案价值挖掘：
  [分析其他方案中可以借鉴的优秀元素]