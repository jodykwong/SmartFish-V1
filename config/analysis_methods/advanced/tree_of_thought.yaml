id: tree_of_thought
name: 思维树深潜
category: advanced
icon: 🌳
short_description: 分解问题探索多条路径，构建思维决策树
full_description: |
  思维树(Tree of Thought)是一种系统性的问题分析方法，将复杂问题分解为树状结构。
  从根问题开始，分支到各个子问题，每个分支代表不同的思考路径。
  通过探索多条路径，找到最优解决方案，避免线性思维的局限。
suitable_for: [复杂决策, 多方案比较, 系统分析, 战略规划]
prompt_template: |
  请使用思维树深潜方法分析"{topic}"：

  🌳 根节点 - 核心问题：
  {topic}

  🌿 第一层分支 - 主要维度：
  分支A：[第一个主要分析维度]
  ├── 子问题A1：[具体子问题]
  ├── 子问题A2：[具体子问题]
  └── 子问题A3：[具体子问题]

  分支B：[第二个主要分析维度]
  ├── 子问题B1：[具体子问题]
  ├── 子问题B2：[具体子问题]
  └── 子问题B3：[具体子问题]

  分支C：[第三个主要分析维度]
  ├── 子问题C1：[具体子问题]
  ├── 子问题C2：[具体子问题]
  └── 子问题C3：[具体子问题]

  🔍 第二层深潜 - 关键路径分析：
  [选择最重要的2-3个子问题进行深入分析]

  路径1：A1 → [深入分析]
  - 现状分析：[当前情况]
  - 影响因素：[关键影响因素]
  - 可能方案：[解决方案选项]
  - 预期结果：[预期效果]

  路径2：B2 → [深入分析]
  - 现状分析：[当前情况]
  - 影响因素：[关键影响因素]
  - 可能方案：[解决方案选项]
  - 预期结果：[预期效果]

  🎯 路径评估与选择：
  - 路径可行性：[各路径的可行性评分]
  - 资源需求：[所需资源对比]
  - 风险评估：[各路径的风险分析]
  - 收益预期：[预期收益对比]

  🏆 最优路径组合：
  - 推荐方案：[基于分析选择的最佳路径组合]
  - 实施顺序：[建议的实施优先级]
  - 协同效应：[不同路径间的协同作用]

  📋 执行计划：
  [基于思维树分析制定的具体执行计划]