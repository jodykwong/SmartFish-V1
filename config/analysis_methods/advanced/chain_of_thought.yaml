id: chain_of_thought
name: 链式思维推理
category: advanced
icon: 🔗
short_description: 逐步展示思考过程，通过连贯推理得出结论
full_description: |
  链式思维(Chain of Thought)是一种结构化的推理方法，通过将复杂问题分解为一系列逻辑步骤。
  每一步都基于前一步的结论，形成清晰的推理链条。
  这种方法提高了推理的透明度和准确性，便于验证和改进。
suitable_for: [复杂推理, 逻辑分析, 决策制定, 问题诊断]
prompt_template: |
  请使用链式思维推理方法分析"{topic}"：

  🎯 问题陈述：
  [清晰定义需要推理分析的问题]

  🔗 推理链条：

  步骤1 - 信息收集：
  - 已知条件：[列出相关的已知信息]
  - 关键假设：[明确必要的假设]
  - 推理依据：[说明推理的理论基础]

  步骤2 - 初步分析：
  - 基于步骤1的信息，我们可以得出：[初步结论]
  - 推理过程：[详细说明推理步骤]
  - 中间结论：[阶段性结论]

  步骤3 - 深入推理：
  - 基于步骤2的结论，进一步分析：[深入分析]
  - 考虑因素：[影响结论的关键因素]
  - 逻辑关系：[因果关系或相关性]

  步骤4 - 综合判断：
  - 整合前面的分析：[综合各步骤的发现]
  - 权衡利弊：[分析不同选择的优劣]
  - 风险评估：[识别潜在风险]

  步骤5 - 最终结论：
  - 基于完整的推理链条：[最终结论]
  - 置信度：[对结论的确信程度]
  - 验证方法：[如何验证这个结论]

  🔍 推理验证：
  - 逻辑一致性检查：[检查推理是否自洽]
  - 反例测试：[考虑可能的反例]
  - 替代解释：[是否有其他可能的解释]

  📋 行动建议：
  [基于推理结论提出具体的行动方案]