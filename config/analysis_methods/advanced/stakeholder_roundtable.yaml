id: stakeholder_roundtable
name: 利益相关者圆桌
category: advanced
icon: 🤝
short_description: 多方视角综合分析，模拟各利益相关者观点
full_description: |
  利益相关者圆桌是一种多视角分析方法，通过模拟不同利益相关者的观点和立场来全面分析问题。
  识别所有相关方，理解他们的需求、关切和影响力，寻找平衡各方利益的解决方案。
  这种方法有助于提高决策的接受度和可执行性。
suitable_for: [政策制定, 项目规划, 冲突解决, 变革管理]
prompt_template: |
  请使用利益相关者圆桌方法分析"{topic}"：

  🎯 议题设定：
  [明确圆桌讨论的核心议题]

  👥 利益相关者识别：

  🏢 内部利益相关者：
  - 管理层：[关切点、期望、影响力]
  - 员工：[关切点、期望、影响力]
  - 股东：[关切点、期望、影响力]

  🌐 外部利益相关者：
  - 客户/用户：[关切点、期望、影响力]
  - 供应商/合作伙伴：[关切点、期望、影响力]
  - 监管机构：[关切点、期望、影响力]
  - 社区/公众：[关切点、期望、影响力]

  🗣️ 圆桌讨论模拟：

  第一轮发言 - 立场表达：
  - 管理层观点：[从管理角度的看法和建议]
  - 员工代表：[从执行层面的关切和建议]
  - 客户代表：[从用户体验角度的需求]
  - 监管代表：[从合规和风险角度的要求]

  第二轮发言 - 互动讨论：
  - 共同关切：[各方都关心的问题]
  - 利益冲突：[存在分歧的地方]
  - 妥协空间：[可能的妥协点]

  第三轮发言 - 方案建议：
  - 各方提出的解决方案
  - 对其他方案的反馈
  - 修正和完善建议

  🤝 共识寻求：
  - 共同目标：[各方认同的目标]
  - 底线原则：[不可妥协的原则]
  - 平衡方案：[兼顾各方利益的方案]

  📋 行动计划：
  - 优先事项：[需要优先解决的问题]
  - 责任分工：[各方的责任和贡献]
  - 沟通机制：[持续沟通和协调机制]
  - 评估标准：[成功的衡量标准]