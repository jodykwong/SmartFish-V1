<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周度评审 - SmartFish</title>
    <style>
        body { font-family: -apple-system, "Noto Sans SC", sans-serif; margin: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; padding: 20px; border: 1px solid #f0f0f0; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 600; color: #1890ff; }
        .stat-label { color: #666; margin-top: 5px; }
        .entry-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .entry-table th { background: #fafafa; padding: 12px; text-align: left; border-bottom: 2px solid #f0f0f0; }
        .entry-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .score-input { width: 60px; padding: 5px; border: 1px solid #d9d9d9; border-radius: 4px; text-align: center; }
        .btn { padding: 10px 20px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:disabled { background: #d9d9d9; cursor: not-allowed; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .status-想法 { background: #d9d9d9; }
        .status-评估中 { background: #faad14; color: white; }
        .status-已落地 { background: #52c41a; color: white; }
        .status-已否决 { background: #f5222d; color: white; }
    </style>
</head>
<body>
    <h1>周度评审</h1>
    
    <div class="stats" id="stats"></div>
    
    <h2>本周思考条目</h2>
    <p style="color: #666;">为每个条目打分（1-10分），系统将根据综合得分推荐Top N进入执行计划。</p>
    
    <table class="entry-table">
        <thead>
            <tr>
                <th>标题</th>
                <th>状态</th>
                <th>影响力</th>
                <th>可行性</th>
                <th>证据充分度</th>
                <th>执行成本</th>
                <th>综合得分</th>
            </tr>
        </thead>
        <tbody id="entries"></tbody>
    </table>
    
    <div style="margin-bottom: 20px;">
        <label>选择Top N: </label>
        <select id="topN" style="padding: 5px;">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
        </select>
    </div>
    
    <button class="btn" onclick="generatePlan()">生成周度计划</button>
    
    <script>
        let entries = [];
        const scores = {};
        
        async function loadReview() {
            const res = await fetch('/thinking/weekly-review');
            const data = await res.json();
            
            entries = data.entries;
            
            // 显示统计
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.stats.total}</div>
                    <div class="stat-label">本周思考</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.stats.gate_pass_count || 0}</div>
                    <div class="stat-label">Gate通过</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.stats.gate_fail_count || 0}</div>
                    <div class="stat-label">Gate否决</div>
                </div>
            `;
            
            // 初始化打分
            entries.forEach(entry => {
                scores[entry.id] = {
                    impact: 5,
                    feasibility: 5,
                    evidence: 5,
                    cost: 5
                };
            });
            
            renderEntries();
        }
        
        function renderEntries() {
            const html = entries.map(entry => {
                const score = scores[entry.id];
                const total = (score.impact + score.feasibility + score.evidence) - score.cost;
                
                return `
                    <tr>
                        <td>${entry.title}</td>
                        <td><span class="status status-${entry.status}">${entry.status}</span></td>
                        <td><input type="number" class="score-input" min="1" max="10" value="${score.impact}" 
                                   onchange="updateScore(${entry.id}, 'impact', this.value)"></td>
                        <td><input type="number" class="score-input" min="1" max="10" value="${score.feasibility}"
                                   onchange="updateScore(${entry.id}, 'feasibility', this.value)"></td>
                        <td><input type="number" class="score-input" min="1" max="10" value="${score.evidence}"
                                   onchange="updateScore(${entry.id}, 'evidence', this.value)"></td>
                        <td><input type="number" class="score-input" min="1" max="10" value="${score.cost}"
                                   onchange="updateScore(${entry.id}, 'cost', this.value)"></td>
                        <td><strong>${total}</strong></td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('entries').innerHTML = html;
        }
        
        function updateScore(entryId, dimension, value) {
            scores[entryId][dimension] = parseInt(value);
            renderEntries();
        }
        
        async function generatePlan() {
            const topN = parseInt(document.getElementById('topN').value);
            
            // 准备数据
            const scoredEntries = entries.map(entry => {
                const score = scores[entry.id];
                return {
                    entry_id: entry.id,
                    impact: score.impact,
                    feasibility: score.feasibility,
                    evidence: score.evidence,
                    cost: score.cost,
                    total_score: (score.impact + score.feasibility + score.evidence) - score.cost
                };
            });
            
            const res = await fetch('/thinking/weekly-review/plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    entries: scoredEntries,
                    top_n: topN
                })
            });
            
            if (res.ok) {
                const result = await res.json();
                alert('周度计划已生成！\n' + result.filepath);
            } else {
                const error = await res.json();
                alert('生成失败: ' + error.error);
            }
        }
        
        loadReview();
    </script>
</body>
</html>
