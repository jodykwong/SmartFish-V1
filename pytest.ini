# pytest 配置
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 忽略导入错误的模块
norecursedirs = 
    .git
    .tox
    venv
    _bmad
    QueryEngine
    InsightEngine
    MediaEngine
    ReportEngine
    ForumEngine
    MindSpider
    SentimentAnalysisModel

# 排除特定测试文件
collect_ignore = 
    tests/test_deepseek_connection.py
    tests/test_gemini_connection.py
    tests/test_eventlet_greendns_workaround.py
    tests/test_eventlet_no_dns.py
    tests/test_httpx_eventlet.py
    tests/test_monitor.py
    tests/test_report_engine_sanitization.py

# 只测试 thinking 模块相关
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
